name: Build artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_CONFIGURATION: Release
  DRIVER_PLATFORM: x64
  WDK_VERSION: "10.0.26100"
  ARTIFACT_RETENTION_DAYS: 7
  RELEASES_TO_KEEP: 10

jobs:
  android-client:
    name: Android client APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore release keystore
        shell: bash
        env:
          SIDEDOCK_RELEASE_KEYSTORE_BASE64: ${{ secrets.SIDEDOCK_RELEASE_KEYSTORE_BASE64 }}
          SIDEDOCK_RELEASE_STORE_PASSWORD: ${{ secrets.SIDEDOCK_RELEASE_STORE_PASSWORD }}
          SIDEDOCK_RELEASE_KEY_ALIAS: ${{ secrets.SIDEDOCK_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SIDEDOCK_RELEASE_KEYSTORE_BASE64"
          echo "$SIDEDOCK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sidedock-release.keystore"
          keytool -list \
            -keystore "$RUNNER_TEMP/sidedock-release.keystore" \
            -storepass "$SIDEDOCK_RELEASE_STORE_PASSWORD" \
            -alias "$SIDEDOCK_RELEASE_KEY_ALIAS" \
            -v | grep -E "Alias name|SHA256:"

      - name: Build signed release APK
        env:
          SIDEDOCK_RELEASE_STORE_FILE: ${{ runner.temp }}/sidedock-release.keystore
          SIDEDOCK_RELEASE_STORE_PASSWORD: ${{ secrets.SIDEDOCK_RELEASE_STORE_PASSWORD }}
          SIDEDOCK_RELEASE_KEY_ALIAS: ${{ secrets.SIDEDOCK_RELEASE_KEY_ALIAS }}
          SIDEDOCK_RELEASE_KEY_PASSWORD: ${{ secrets.SIDEDOCK_RELEASE_KEY_PASSWORD }}
        run: gradle -p android-client :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sidedock-android-release-apk
          path: android-client/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  windows-host:
    name: Windows host
    runs-on: windows-2022
    needs:
      - windows-driver

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Ensure Windows SDK is available
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Test-WindowsSdk {
            $sdkHeader = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$env:WDK_VERSION.*\um\mfvirtualcamera.h" -ErrorAction SilentlyContinue
            $sdkLib = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib\$env:WDK_VERSION.*\um\x64\Mfsensorgroup.lib" -ErrorAction SilentlyContinue
            return ($sdkHeader.Count -gt 0 -and $sdkLib.Count -gt 0)
          }

          if (Test-WindowsSdk) {
            Write-Host "Windows SDK $env:WDK_VERSION is already available."
            exit 0
          }

          Write-Host "Installing Windows SDK $env:WDK_VERSION."
          winget install --id Microsoft.WindowsSDK.$env:WDK_VERSION --source winget --silent --accept-package-agreements --accept-source-agreements

          if (-not (Test-WindowsSdk)) {
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -ErrorAction SilentlyContinue |
              Select-Object FullName |
              Format-Table -AutoSize
            throw "Windows SDK $env:WDK_VERSION was not found after installation."
          }

      - name: Restore
        run: |
          dotnet restore .\windows-host\SideDock.Host\SideDock.Host.csproj
          dotnet restore .\windows-host\SideDock.Host.App\SideDock.Host.App.csproj
          dotnet restore .\windows-host\SideDock.Host.Launcher\SideDock.Host.Launcher.csproj
          dotnet restore .\windows-host\SideDock.VirtualCamera.Tool\SideDock.VirtualCamera.Tool.csproj
          nuget restore .\windows-host\SideDock.VirtualCamera.MediaSource\packages.config -PackagesDirectory .\windows-host\SideDock.VirtualCamera.MediaSource\packages -NonInteractive

      - name: Download driver installer
        uses: actions/download-artifact@v4
        with:
          name: sidedock-driver-installer
          path: ${{ runner.temp }}\sidedock-driver-installer

      - name: Publish host app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "sidedock-windows-host"
          dotnet publish .\windows-host\SideDock.Host\SideDock.Host.csproj `
            --configuration $env:BUILD_CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            --output $out

          $payloadRoot = Join-Path $env:RUNNER_TEMP "sidedock-host-payload"
          New-Item -ItemType Directory -Force $payloadRoot | Out-Null
          Copy-Item -Recurse -Force $out (Join-Path $payloadRoot "SideDock.Host")

          $virtualCameraMediaSourceOut = Join-Path $env:RUNNER_TEMP "sidedock-virtual-camera-mediasource"
          New-Item -ItemType Directory -Force $virtualCameraMediaSourceOut | Out-Null
          msbuild .\windows-host\SideDock.VirtualCamera.MediaSource\SideDock.VirtualCamera.MediaSource.vcxproj `
            /m `
            /p:Configuration=$env:BUILD_CONFIGURATION `
            /p:Platform=x64 `
            "/p:OutDir=$virtualCameraMediaSourceOut\"
          $virtualCameraMediaSourceDll = Join-Path $virtualCameraMediaSourceOut "SideDock.VirtualCamera.MediaSource.dll"
          if (-not (Test-Path -LiteralPath $virtualCameraMediaSourceDll)) {
            throw "Virtual camera media source DLL was not produced: $virtualCameraMediaSourceDll"
          }

          $virtualCameraToolOut = Join-Path $env:RUNNER_TEMP "sidedock-virtual-camera-tool"
          dotnet publish .\windows-host\SideDock.VirtualCamera.Tool\SideDock.VirtualCamera.Tool.csproj `
            --configuration $env:BUILD_CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output $virtualCameraToolOut
          $virtualCameraToolExe = Join-Path $virtualCameraToolOut "SideDock.VirtualCamera.Tool.exe"
          if (-not (Test-Path -LiteralPath $virtualCameraToolExe)) {
            throw "Virtual camera tool executable was not produced: $virtualCameraToolExe"
          }
          Copy-Item -Force $virtualCameraMediaSourceDll $virtualCameraToolOut
          Copy-Item -Recurse -Force $virtualCameraToolOut (Join-Path $payloadRoot "SideDock.VirtualCamera.Tool")

          Compress-Archive -Path (Join-Path $payloadRoot "*") -DestinationPath .\windows-host\SideDock.Host.App\HostPayload.zip -Force

          $platformToolsZip = Join-Path $env:RUNNER_TEMP "platform-tools-latest-windows.zip"
          $platformToolsExtract = Join-Path $env:RUNNER_TEMP "platform-tools-latest-windows"
          $bundledPlatformTools = Join-Path (Resolve-Path ".\windows-host\SideDock.Host.App") "platform-tools\win-x64"
          Invoke-WebRequest `
            -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" `
            -OutFile $platformToolsZip
          Expand-Archive -Path $platformToolsZip -DestinationPath $platformToolsExtract -Force
          Remove-Item -Recurse -Force $bundledPlatformTools -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $bundledPlatformTools | Out-Null
          Copy-Item -Force (Join-Path $platformToolsExtract "platform-tools\adb.exe") $bundledPlatformTools
          Copy-Item -Force (Join-Path $platformToolsExtract "platform-tools\AdbWinApi.dll") $bundledPlatformTools
          Copy-Item -Force (Join-Path $platformToolsExtract "platform-tools\AdbWinUsbApi.dll") $bundledPlatformTools

          $driverInstallerPayload = Join-Path $env:RUNNER_TEMP "driver-installer-payload"
          New-Item -ItemType Directory -Force $driverInstallerPayload | Out-Null
          Copy-Item -Recurse -Force "${env:RUNNER_TEMP}\sidedock-driver-installer" (Join-Path $driverInstallerPayload "SideDock.Driver.Installer")
          Compress-Archive -Path (Join-Path $driverInstallerPayload "*") -DestinationPath .\windows-host\SideDock.Host.App\DriverInstallerPayload.zip -Force

          $virtualAudioCablePayload = ".\third_party\vb-cable\VBCABLE_Driver_Pack45.zip"
          if (Test-Path -LiteralPath $virtualAudioCablePayload) {
            Copy-Item -Force $virtualAudioCablePayload .\windows-host\SideDock.Host.App\VirtualAudioCablePayload.zip
            Write-Host "Embedded VB-CABLE payload."
          } else {
            Write-Host "VB-CABLE payload not found; host app will rely on a local installer."
          }

          $appOut = Join-Path $env:RUNNER_TEMP "sidedock-host-app-ui"
          dotnet publish .\windows-host\SideDock.Host.App\SideDock.Host.App.csproj `
            --configuration $env:BUILD_CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output $appOut

          $launcherPayloadRoot = Join-Path $env:RUNNER_TEMP "sidedock-host-launcher-payload"
          New-Item -ItemType Directory -Force $launcherPayloadRoot | Out-Null
          Copy-Item -Recurse -Force $appOut (Join-Path $launcherPayloadRoot "SideDock.Host.App")
          Compress-Archive -Path (Join-Path $launcherPayloadRoot "*") -DestinationPath .\windows-host\SideDock.Host.Launcher\HostPayload.zip -Force

          $launcherOut = Join-Path $env:RUNNER_TEMP "sidedock-host-launcher"
          dotnet publish .\windows-host\SideDock.Host.Launcher\SideDock.Host.Launcher.csproj `
            --configuration $env:BUILD_CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output $launcherOut
          Copy-Item -Force .\windows-host\SideDock.Host.Launcher\HostPayload.zip (Join-Path $launcherOut "HostPayload.zip")
          $launcherExe = Join-Path $launcherOut "SideDock.Host.App.exe"
          if (-not (Test-Path -LiteralPath $launcherExe)) {
            throw "Launcher executable was not produced."
          }
          $hostAppOut = Join-Path $env:RUNNER_TEMP "sidedock-host-app"
          New-Item -ItemType Directory -Force $hostAppOut | Out-Null
          Copy-Item -Force $launcherExe (Join-Path $hostAppOut "SideDock.Host.App.exe")

      - name: Upload host app
        uses: actions/upload-artifact@v4
        with:
          name: sidedock-host-app
          path: ${{ runner.temp }}\sidedock-host-app\SideDock.Host.App.exe
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  windows-driver:
    name: Windows driver package
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WDK is available
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Test-WdkTargets {
            $driverTargets = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\build\$env:WDK_VERSION.*\WindowsDriver.Common.targets" -ErrorAction SilentlyContinue
            $driverTasks = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\build\$env:WDK_VERSION.*\bin\Microsoft.DriverKit.Build.Tasks.17.0.dll" -ErrorAction SilentlyContinue
            $driverToolset = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\*\MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets\WindowsUserModeDriver10.0\Toolset.props" -ErrorAction SilentlyContinue
            return ($driverTargets.Count -gt 0 -and $driverTasks.Count -gt 0 -and $driverToolset.Count -gt 0)
          }

          if (Test-WdkTargets) {
            Write-Host "WDK MSBuild targets are already available."
            exit 0
          }

          Write-Host "Installing Windows SDK and WDK."
          winget install --id Microsoft.WindowsSDK.$env:WDK_VERSION --source winget --silent --accept-package-agreements --accept-source-agreements
          winget install --id Microsoft.WindowsWDK.$env:WDK_VERSION --source winget --silent --accept-package-agreements --accept-source-agreements

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $enginePath = & $vswhere -nologo -latest -products * -property enginePath
          if (-not $enginePath) {
            throw "Unable to locate Visual Studio Installer engine."
          }

          $vsixInstaller = Join-Path $enginePath "VSIXInstaller.exe"
          $wdkVsix = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Vsix\VS2022" -Filter WDK.vsix -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if ($wdkVsix) {
            & $vsixInstaller /quiet $wdkVsix.FullName
          }

          if (-not (Test-WdkTargets)) {
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\build" -ErrorAction SilentlyContinue |
              Select-Object FullName |
              Format-Table -AutoSize
            throw "WDK MSBuild targets were not found after installation."
          }

      - name: Build display driver solution
        shell: pwsh
        run: |
          msbuild .\windows-driver\SideDock.Driver.sln `
            /m `
            /p:Configuration=$env:BUILD_CONFIGURATION `
            /p:Platform=$env:DRIVER_PLATFORM `
            /p:_NT_TARGET_VERSION=0xA000007 `
            /p:RunCodeAnalysis=false `
            /p:EnablePREfast=false `
            /p:SkipPackageVerification=true `
            /p:SignMode=Off

      - name: Self-sign driver packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $driverPackage = Resolve-Path ".\windows-driver\SideDock.Idd\x64\Release\SideDock.Idd"
          $infPath = Join-Path $driverPackage "SideDock.Idd.inf"
          $certPath = Join-Path $driverPackage "SideDock.Idd.cer"
          $catPath = Join-Path $driverPackage "sidedock.idd.cat"
          $signtool = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
          $infContent = Get-Content -Raw $infPath
          if ($infContent -notmatch 'NTamd64\.10\.0\.\.\.18362') {
            throw "Driver INF was not stamped for Windows 10 1903+ (18362): $infPath"
          }
          if ($infContent -match 'NTamd64\.10\.0\.\.\.22000') {
            throw "Driver INF was stamped for Windows 11 only (22000): $infPath"
          }
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=SideDock Self-Signed Driver" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy Exportable `
            -KeyLength 2048 `
            -HashAlgorithm SHA256
          Export-Certificate -Cert $cert -FilePath $certPath | Out-Null
          & $signtool sign `
            /v `
            /fd SHA256 `
            /s My `
            /sha1 $cert.Thumbprint `
            $catPath

          Write-Host "Self-signed display driver package for SideDock-controlled installations."

      - name: Build driver installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payloadRoot = Join-Path $env:RUNNER_TEMP "driver-payload"
          $driverDest = Join-Path $payloadRoot "SideDock.Idd"
          $toolDest = Join-Path $payloadRoot "SideDock.Idd.DeviceTool"
          New-Item -ItemType Directory -Force $driverDest, $toolDest | Out-Null
          Copy-Item -Recurse -Force .\windows-driver\SideDock.Idd\x64 $driverDest
          Copy-Item -Recurse -Force .\windows-driver\SideDock.Idd.DeviceTool\x64 $toolDest
          $payloadInf = Join-Path $driverDest "x64\Release\SideDock.Idd\SideDock.Idd.inf"
          $payloadInfContent = Get-Content -Raw $payloadInf
          if ($payloadInfContent -notmatch 'NTamd64\.10\.0\.\.\.18362') {
            throw "Driver payload INF was not stamped for Windows 10 1903+ (18362): $payloadInf"
          }
          Compress-Archive -Path (Join-Path $payloadRoot "*") -DestinationPath .\windows-driver\SideDock.Driver.Installer\DriverPayload.zip -Force
          dotnet publish .\windows-driver\SideDock.Driver.Installer\SideDock.Driver.Installer.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output "$env:RUNNER_TEMP\sidedock-driver-installer"

      - name: Upload driver installer
        uses: actions/upload-artifact@v4
        with:
          name: sidedock-driver-installer
          path: ${{ runner.temp }}\sidedock-driver-installer\SideDock.Driver.Installer.exe
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - android-client
      - windows-driver
      - windows-host

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-input

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          android_apk="$(find release-input/sidedock-android-release-apk -type f -name "*.apk" | head -n 1)"
          test -n "$android_apk"
          cp "$android_apk" release-assets/SideDock.Android.Release.apk
          cp release-input/sidedock-host-app/SideDock.Host.App.exe release-assets/SideDock.Host.App.exe
          cp release-input/sidedock-driver-installer/SideDock.Driver.Installer.exe release-assets/SideDock.Driver.Installer.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="build-${GITHUB_RUN_NUMBER}-${short_sha}"
          gh release create "$tag" release-assets/* \
            --title "SideDock build ${GITHUB_RUN_NUMBER} (${short_sha})" \
            --notes "Automated build from ${GITHUB_SHA}." \
            --target "$GITHUB_SHA"

      - name: Prune old automated releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list \
            --limit 1000 \
            --order desc \
            --json tagName,isDraft,isPrerelease,createdAt \
            --jq '.[] | select(.tagName | startswith("build-")) | .tagName' |
            tail -n +"$((RELEASES_TO_KEEP + 1))" |
            while read -r old_tag; do
              test -n "$old_tag" || continue
              gh release delete "$old_tag" --cleanup-tag --yes
            done
